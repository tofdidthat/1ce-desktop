[package]
name = "onece-desktop"
version = "0.2.0-alpha.1"
description = "1CE Desktop — local beat production workflow"
authors = ["1CE"]
edition = "2021"

[lib]
name = "onece_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2" }

[dependencies]
tauri = { version = "2.12.3" }
tauri-plugin-dialog = "2.8.2"
serde = { version = "1", features = ["derive"] }
