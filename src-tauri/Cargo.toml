[package]
name = "onece-desktop"
version = "0.2.0-alpha.1"
description = "1CE Desktop — local beat production workflow"
authors = ["1CE"]
edition = "2021"

[lib]
name = "onece_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_System_JobObjects"] }
